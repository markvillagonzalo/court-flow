services:
  db:
    image: postgres:17-alpine
    container_name: court-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: courtflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - court-flow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courtflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  court-flow-postgres:
